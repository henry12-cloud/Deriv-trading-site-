<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deriv Trading Site</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Deriv Trading</h1>
        <p>Third-Party Trading Interface</p>
    </header>

    <main>

        <section class="account">
            <h2>Account</h2>
            <p>Balance: <span id="balance">$0.00</span></p>
        </section>

        <section class="market">
            <h2>Market</h2>

            <select id="symbol">
                <option value="R_100">Volatility 100</option>
                <option value="R_75">Volatility 75</option>
                <option value="R_50">Volatility 50</option>
            </select>

            <div class="price">
                <span id="price">Waiting...</span>
            </div>
        </section>

        <section class="chart">
            <h2>Chart</h2>

            <div id="chart">
                Chart will appear here
            </div>
        </section>

        <section class="trade">
            <h2>Trade</h2>

            <input
                type="number"
                id="amount"
                placeholder="Stake amount"
                value="1"
                min="0.35"
                step="0.01"
            >

            <div class="buttons">
                <button id="buy">BUY</button>
                <button id="sell">SELL</button>
            </div>
        </section>

        <section class="open-trades">
            <h2>Open Trade</h2>

            <div id="openTrade">
                No open trade
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
